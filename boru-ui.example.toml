# boru-ui.example.toml — Boru development theme overrides (BORU-UI-04)
#
# This file documents the `boru-ui.toml` dev theme override format. Copy it
# to your data dir as `boru-ui.toml` to change Boru's appearance WITHOUT
# rebuilding:
#
#   Linux/macOS:   ~/.local/share/boru/boru-ui.toml
#   Windows:       %LOCALAPPDATA%\boru\boru-ui.toml
#   (or the directory printed by `cargo run` at startup / --data-dir)
#
# Rules
# -----
# * ONLY visual values live here. Networking, chat, file transfer, video,
#   tunnel, lobby, room and persistence behaviour are NEVER configured here.
# * Every key is optional. Missing keys/groups fall back to
#   `BoruTheme::default()` (BORU-UI-05). An empty file is valid.
# * The file may be deleted at any time — startup never fails because of it.
# * A malformed file is logged with a line/column error and the last
#   known-good theme is kept.
# * Field names mirror the `BoruTheme` token groups in
#   `src/bin/boru/theme.rs` (sidebar.width, chat.bubble_max_width, …).
#
# Units / ranges
# --------------
# * Lengths, sizes, padding, spacing, radii, widths, heights: pixels (px),
#   positive floats. 0 is allowed (e.g. radii.none = 0.0). Values far
#   outside the current defaults (e.g. negative padding, absurd sidebar
#   widths) are developer-error candidates in BORU-UI-05 and should be
#   avoided.
# * `chat.bubble_width_ratio`: fraction 0..=1 of the timeline width.
# * `home.quick_action_desc_line_height`: unitless line-height ratio.
# * `motion.sidebar_fade_frames`: integer frame count (default 5).
# * Colours: hex string "#RRGGBB" / "#RRGGBBAA" or an array of 0..=1 floats
#   [r, g, b] / [r, g, b, a].
#
# The values below are the CURRENT BASELINE (they reproduce the default UI).
# Override only what you want to change; leave the rest commented or absent.


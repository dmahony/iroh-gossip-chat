name: Version Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      skip_pr_titles:
        description: "Also inspect individual commit messages (default: PR title only)"
        required: false
        default: "false"

permissions:
  contents: read
  pull-requests: read

jobs:
  check-version:
    name: Check Proposed Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check .version-state.json
        id: check_state
        run: |
          if [ ! -f .version-state.json ]; then
            echo "state_exists=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: .version-state.json not found." >> "$GITHUB_STEP_SUMMARY"
            echo "Run 'python scripts/version.py initialise' locally to create it." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "state_exists=true" >> "$GITHUB_OUTPUT"
          echo "Version state found:" >> "$GITHUB_STEP_SUMMARY"
          cat .version-state.json >> "$GITHUB_STEP_SUMMARY"

      - name: Run version check
        if: steps.check_state.outputs.state_exists == 'true'
        id: version_check
        run: |
          echo "## Version Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python scripts/version.py check >> "$GITHUB_STEP_SUMMARY" 2>&1

      - name: Summarise for PR
        if: github.event_name == 'pull_request'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### PR Details" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR title: ${{ github.event.pull_request.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.head_ref }} → ${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> This workflow is **read-only**. It never modifies the repository," >> "$GITHUB_STEP_SUMMARY"
          echo "> creates tags, or creates releases." >> "$GITHUB_STEP_SUMMARY"

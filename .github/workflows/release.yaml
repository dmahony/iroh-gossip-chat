name: Release

# Automatic releases disabled (2026-08-05): the `push: tags: ["v*"]` trigger
# was removed so pushing a version tag no longer publishes a release. Releases
# now happen only via manual workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: ""

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: boru-linux-x86_64
            binary: boru
            # Linux ships inline GStreamer playback.
            features: gui,video-playback
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: boru-windows-x86_64
            binary: boru.exe
            # Windows uses every validated native feature except
            # video-playback. WIN-FEAT-01 direction b deliberately keeps
            # GStreamer out of the executable: undownloaded videos stream
            # over local HTTP to the OS default player. See the Build step
            # comment.
            features: gui,terminal,voice-calls,video-calls,screen-sharing
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: boru-macos-aarch64
            binary: boru
            features: gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        run: python3 scripts/release-validate.py "${{ github.event.inputs.release_version }}"

      - name: Validate release feature matrix
        shell: bash
        run: python3 scripts/check-release-feature-matrix.py

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: |
          # Per-target feature matrix (keep this explicit when adding a
          # feature): Linux=gui,video-playback; Windows=gui,terminal,
          # voice-calls,video-calls,screen-sharing; macOS=gui. Windows
          # deliberately excludes video-playback (WIN-FEAT-01 direction b):
          # gstreamer-sys links import libraries, so enabling it would make
          # boru.exe fail to start when the runtime DLLs are missing. Instead,
          # undownloaded videos are served over a local HTTP streaming server
          # and opened in the OS default player (VLC/browser). The reviewed
          # GStreamer runtime remains bundled for capability detection and a
          # future dynamic-loading / delay-load build.
          cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }} --bin boru

      - name: Optional Windows Authenticode signing hook
        if: runner.os == 'Windows'
        shell: bash
        env:
          BORU_WINDOWS_SIGNTOOL: ${{ vars.BORU_WINDOWS_SIGNTOOL }}
          BORU_WINDOWS_CERTIFICATE: ${{ secrets.BORU_WINDOWS_CERTIFICATE }}
          BORU_WINDOWS_TIMESTAMP_URL: ${{ vars.BORU_WINDOWS_TIMESTAMP_URL }}
        run: bash scripts/release-sign.sh windows "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Fetch GStreamer MSVC runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pin the reviewed GStreamer MSVC runtime.  scripts/package_windows.sh
          # ships only the curated plugin subset + runtime DLL closure
          # (scripts/gstreamer-windows-plugins.txt / -runtime.txt), and the
          # bundled version must match the manifests.
          curl -fL -o gstreamer-runtime.msi \
            "https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/gstreamer-1.0-msvc-x86_64-1.24.13.msi"
          echo "66915d82adda34189703c36a5d2ef145d2e3afb7afc12c66fcf2ea506e2466d2  gstreamer-runtime.msi" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gstreamer-extract"
          msiexec //a gstreamer-runtime.msi //qn TARGETDIR="C:\\gstreamer-extract"
          echo "GSTREAMER_MSVC_ROOT=C:/gstreamer-extract/gstreamer/1.0/msvc_x86_64" >> "$GITHUB_ENV"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Self-contained Windows package: boru.exe + Papirus icons +
            # reviewed GStreamer runtime + third-party notices + toolchain
            # runtime DLLs.  Icons are bundled by the script so the
            # exe-relative loader always resolves them (PAPIRUS-17).
            bash scripts/package_windows.sh \
              --exe "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
              --gst-root "$GSTREAMER_MSVC_ROOT" \
              --target "${{ matrix.target }}" \
              --out dist
            # package_windows.sh writes the zip + sha256 into --out; move the
            # payload to the workspace root for upload-artifact's stable path.
            for f in dist/boru-windows-*.zip; do
              base=$(basename "$f")
              mv "$f" "$base"
            done
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
            mkdir -p dist/assets/third_party
            cp -r assets/third_party/papirus dist/assets/third_party/papirus
            # Twemoji emoji assets + notices (BORU-TWEMOJI-23): the runtime
            # loader probes <exe_dir>/assets/emoji/twemoji, and the release
            # artifact must carry the CC-BY 4.0 / MIT licence texts alongside
            # the artwork (assets/emoji/twemoji/ATTRIBUTION.md).
            mkdir -p dist/assets/emoji
            cp -r assets/emoji/twemoji dist/assets/emoji/twemoji
            cp THIRD_PARTY_NOTICES.md dist/
            cd dist
            tar -czf "../${{ matrix.artifact }}.tar.gz" "${{ matrix.binary }}" assets/ THIRD_PARTY_NOTICES.md
          fi

      - name: Optional macOS app signing and notarization hook
        if: runner.os == 'macOS'
        env:
          BORU_MACOS_SIGN_IDENTITY: ${{ vars.BORU_MACOS_SIGN_IDENTITY }}
          BORU_MACOS_NOTARY_PROFILE: ${{ secrets.BORU_MACOS_NOTARY_PROFILE }}
        run: |
          if [[ -n "${BORU_MACOS_SIGN_IDENTITY:-}" ]]; then
            [[ -d dist/Boru.app ]] || { echo "FATAL: macOS signing is configured but dist/Boru.app was not packaged" >&2; exit 1; }
            bash scripts/release-sign.sh macos dist/Boru.app
          else
            echo "macOS app signing skipped: BORU_MACOS_SIGN_IDENTITY is not configured"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        run: python3 scripts/release-validate.py "${{ github.event.inputs.release_version }}"
      - name: Generate resolved Cargo SPDX SBOM
        run: |
          cargo metadata --locked --format-version 1 > cargo-metadata.json
          python3 scripts/generate-spdx-sbom.py cargo-metadata.json boru-cargo-sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: boru-cargo-sbom
          path: boru-cargo-sbom.spdx.json

  release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
      - name: Assemble and verify release payloads
        shell: bash
        run: |
          mkdir -p release-assets
          find boru-linux-x86_64 boru-windows-x86_64 boru-macos-aarch64 boru-cargo-sbom \
            -maxdepth 1 -type f -exec cp {} release-assets/ \;
          python3 scripts/release-validate.py "${{ github.event.inputs.release_version }}"
          scripts/release-checksums.sh release-assets
      - name: Optional Linux checksum-manifest signing hook
        env:
          BORU_LINUX_SIGNING_KEY: ${{ secrets.BORU_LINUX_SIGNING_KEY }}
          BORU_LINUX_SIGNING_PUBLIC_KEY: ${{ secrets.BORU_LINUX_SIGNING_PUBLIC_KEY }}
        run: bash scripts/release-sign.sh linux release-assets/SHA256SUMS
      - name: Attest release payload provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Set release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.release_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

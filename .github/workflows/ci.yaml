name: CI

on:
  pull_request:
    types: [ 'labeled', 'unlabeled', 'opened', 'synchronize', 'reopened' ]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  MSRV: "1.91"
  SCCACHE_CACHE_SIZE: "50G"
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  tests:
    name: CI Test Suite
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    uses: './.github/workflows/tests.yaml'

  fuzz_smoke:
    name: Fuzz Smoke (bounded)
    timeout-minutes: 15
    runs-on: [self-hosted, linux, X64]
    env:
      # Bounded on purpose: this is the deterministic adversarial/fuzz smoke
      # suite (tests/security/*).  CI keeps the session short (200 iterations
      # per fuzz test); a longer libFuzzer session runs locally or nightly
      # via `cargo +nightly fuzz run` in fuzz/.
      BORU_FUZZ_ITERATIONS: "200"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "50G"
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Run deterministic adversarial + fuzz smoke tests
      run: cargo test --test security --release
      env:
        RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}

  cross_build:
    name: Cross Build Only
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    runs-on: [self-hosted, linux, X64]
    strategy:
      fail-fast: false
      matrix:
        target:
           # cross tests are currently broken vor armv7 and aarch64
           # see https://github.com/cross-rs/cross/issues/1311
          # - armv7-linux-androideabi
          # - aarch64-linux-android
          # Freebsd execution fails in cross
          # - i686-unknown-freebsd # Linking fails :/
          - x86_64-unknown-freebsd
          # Netbsd execution fails to link in cross
          # - x86_64-unknown-netbsd
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Cleanup Docker
      continue-on-error: true
      run: |
        docker kill $(docker ps -q)

      # See https://github.com/cross-rs/cross/issues/1222
    - uses: taiki-e/install-action@cross

    - name: build
      # cross tests are currently broken vor armv7 and aarch64
      # see https://github.com/cross-rs/cross/issues/1311.  So on
      # those platforms we only build but do not run tests.
      run: cross build --all --target ${{ matrix.target }}
      env:
        RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}

  android_build:
    name: Android Build Only
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    # runs-on: ubuntu-latest
    runs-on: [self-hosted, linux, X64]
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        target: ${{ matrix.target }}
    - name: Install rustup target
      run: rustup target add ${{ matrix.target }}

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Android NDK
      uses: arqu/setup-ndk@main
      id: setup-ndk
      with:
        ndk-version: r23
        add-to-path: true

    - name: Build
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        cargo install --version 3.5.4 cargo-ndk
        cargo ndk --target ${{ matrix.target }} build

  cross_test:
    name: Cross Test
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    runs-on: [self-hosted, linux, X64]
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Cleanup Docker
      continue-on-error: true
      run: |
        docker kill $(docker ps -q)

      # See https://github.com/cross-rs/cross/issues/1222
    - uses: taiki-e/install-action@cross

    - name: test
      run: cross test --all --target ${{ matrix.target }} -- --test-threads=12
      env:
        RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG' }}

  wasm_build:
      name: Build wasm32
      runs-on: ubuntu-latest
      env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
      steps:
        - name: Checkout sources
          uses: actions/checkout@v7
  
        - name: Install stable toolchain
          uses: dtolnay/rust-toolchain@stable
  
        - name: Add wasm target
          run: rustup target add wasm32-unknown-unknown
  
        - name: Install wasm-tools
          uses: bytecodealliance/actions/wasm-tools/setup@v1
  
        - name: wasm32 build
          run: cargo build --target wasm32-unknown-unknown
  
        # If the Wasm file contains any 'import "env"' declarations, then
        # some non-Wasm-compatible code made it into the final code.
        - name: Ensure no 'import "env"' in iroh-relay Wasm
          run: |
            ! wasm-tools print --skeleton target/wasm32-unknown-unknown/debug/boru.wasm | grep 'import "env"'
        

  check_semver:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Environment (PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          echo "HEAD_COMMIT_SHA=$(git rev-parse origin/${{ github.base_ref }})" >> ${GITHUB_ENV}
      - name: Setup Environment (Push)
        if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' }}
        shell: bash
        run: |
          echo "HEAD_COMMIT_SHA=$(git rev-parse origin/main)" >> ${GITHUB_ENV}
      - name: Check semver
        # uses: obi1kenobi/cargo-semver-checks-action@v2
        uses: n0-computer/cargo-semver-checks-action@feat-baseline
        with:
          baseline-rev: ${{ env.HEAD_COMMIT_SHA }}
          use-cache: false

  check_fmt:
    timeout-minutes: 30
    name: Checking fmt
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - uses: mozilla-actions/sccache-action@v0.0.11
    - uses: taiki-e/install-action@cargo-make
    - run: cargo make format-check

  check_docs:
    timeout-minutes: 30
    name: Checking docs
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
      # Fail on any rustdoc warning: broken intra-doc links, unresolved links,
      # invalid HTML, etc. The crate also denies missing_docs and
      # rustdoc::broken_intra_doc_links at the crate root (src/lib.rs).
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build docs (all features, no deps)
        # --all-features matches [package.metadata.docs.rs] (all-features = true)
        # and the Docs Preview job (.github/workflows/docs.yaml). The all-features
        # feature matrix is valid on ubuntu-latest: the platform-dependent
        # features (gui / video-calls / voice-calls) are Linux-first and the
        # runner image ships the native libraries they need (X11/Wayland/GL,
        # GStreamer, ALSA, libclang for nokhwa's bindgen, C++ toolchain for
        # openh264). --no-deps keeps the check focused on this crate's docs.
        # sccache only caches dependency compilation, never rustdoc output, so
        # every run re-documents the crate and cannot be hidden by stale cache.
        run: cargo doc --workspace --all-features --no-deps


  clippy_check:
    timeout-minutes: 30
    name: Clippy (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux full coverage (baseline) ─────────────────────────────
          # Multiple feature sets so feature-gated code paths are linted too.
          # Replaces the old single Ubuntu job that ran all three invocations
          # on one runner; behavior for the Linux matrix is unchanged.
          - name: linux-all-features
            os: ubuntu-latest
            clippy_args: --workspace --all-features --all-targets --bins --tests --benches
          - name: linux-no-default
            os: ubuntu-latest
            clippy_args: --workspace --no-default-features --lib --bins --tests
          - name: linux-default
            os: ubuntu-latest
            clippy_args: --workspace --all-targets
          # ── Platform matrix ────────────────────────────────────────────
          # The Linux runners never compile cfg(windows) / cfg(target_os =
          # "macos") code (app.rs, main.rs, terminal_view.rs carry platform
          # blocks), so platform-gated paths were previously linted nowhere.
          # Windows/macOS native runners close that gap. Kept bounded: only
          # default features (gui + net + metrics) are linted here — that is
          # where all platform-gated GUI code lives, and it keeps the job
          # portable. Non-portable all-features deps are NOT forced on these
          # runners: screen-sharing pulls Linux-only zbus/x11rb (and Windows
          # winrt on the other side) and video-calls builds native codecs, so
          # those remain covered by the Linux all-features entry above.
          - name: windows-default
            os: windows-latest
            clippy_args: --workspace --all-targets
          - name: macos-default
            os: macos-latest
            clippy_args: --workspace --all-targets
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: clippy (${{ matrix.name }})
      run: cargo clippy ${{ matrix.clippy_args }}

  msrv:
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    name: Minimal Supported Rust Version
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.MSRV }}
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Check MSRV all features
      run: |
        cargo +$MSRV check --workspace --all-targets

  cargo_deny:
    timeout-minutes: 30
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features
          command: check
          command-arguments: "-Dwarnings"

  codespell:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: pip install --user codespell[toml]
    - run: codespell --ignore-words-list=ans,atmost,crate,inout,ratatui,ser,stayin,swarmin,worl --skip=docs/CHANGELOG.md

  # Architecture guardrail (BORU-CI-002): report source files that have grown
  # past the chosen size thresholds and check the curated coordinator/facade
  # caps. The broad source sweep remains advisory, while the curated
  # coordinator/facade caps are hard-gated by --enforce.
  check_module_size:
    name: Check module size guardrails
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Report architectural growth and enforce curated caps
      run: ./scripts/check-module-size.sh --enforce

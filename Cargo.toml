[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "iroh_docsrs"]

[profile.bench]
debug = true

# Production binaries: optimize for size and runtime performance.
[profile.release]
debug = 0
strip = true
lto = "fat"
codegen-units = 1

# Profiling keeps release optimizations while retaining DWARF symbols for
# profilers and actionable backtraces. It is intentionally separate from the
# stripped production profile.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# ── Windows 11 DNS fix ─────────────────────────────────────────────────
# iroh-dns-1.0.0 uses hickory-resolver which sends plain UDP DNS queries.
# Windows 11 configures DNS over HTTPS (DoH) by default, silently dropping
# UDP queries.  The patched version adds Cloudflare/Google DoH nameservers
# as fallback resolvers and increases the DNS timeout from 3s to 5s.
# See patched/iroh-dns/src/dns.rs for the actual changes.
#
# ── Mainline v7.0.0 Windows compatibility ──────────────────────────────
# UdpSocket::set_read_timeout causes recv_from to return TimedOut on
# Windows (WSAETIMEDOUT / 10060) when idle.  Upstream only handles
# WouldBlock silently, so Windows logs spurious "IO error" warnings every
# ~50ms.  See patched/mainline/src/rpc/socket.rs for the fix.
[patch.crates-io]
iroh = { path = "patched/iroh" }
iroh-dns = { path = "patched/iroh-dns" }
iroh-relay = { path = "patched/iroh-relay" }
irpc = { path = "patched/irpc" }
mainline = { path = "patched/mainline" }
n0-mainline = { path = "patched/n0-mainline" }
# noq-udp: cmsg decode assert compared TYPE alignments
# (align_of::<T>() <= align_of::<C>()), which is wrong on musl where
# libc::cmsghdr has socklen_t cmsg_len → struct align 4: decoding a
# SCM_TIMESTAMPNS (timespec, align 8) payload panics even though the kernel
# 8-aligns the actual payload. Patch checks the real pointer alignment
# instead. See patched/noq-udp/src/cmsg/mod.rs.
noq-udp = { path = "patched/noq-udp" }

# ── p2panda-encryption 0.7.0: hpke-rs 0.6.1 → 0.7.0 (libcrux advisory fixes) ──
# p2panda-encryption 0.7.0 (crates.io) pins hpke-rs ^0.6.1, which pins
# libcrux-sha3 ^0.0.8 (<0.0.9) and libcrux-secrets 0.0.5 — all three carrying
# RUSTSEC-2026-0207 / RUSTSEC-2026-0208 / RUSTSEC-2026-0212 (incorrect SHAKE
# output, AVX2 SHAKE-256 panic, aarch64 constant-time swap). Upstream p2panda
# fixed this by bumping hpke-rs to 0.7.0 (which pins libcrux-sha3 =0.0.10 and
# pulls libcrux-traits 0.0.8 → libcrux-secrets 0.0.6) with NO source change —
# the API p2panda uses (Hpke::new/seal/open, HpkePublicKey/PrivateKey::new,
# Mode) is unchanged. This vendored copy is crates.io 0.7.0 source with only
# the hpke-rs dependency constraints bumped, mirroring p2panda git main.
p2panda-encryption = { path = "patched/p2panda-encryption" }

# ── iced_tiny_skia 0.14.0 geometry-clip double-transform fix ──────────
# The 0.14.0 tiny-skia render loop computes the group clip bounds as
# `clip_bounds * transformation * scale_factor`, but `draw_primitive_group`
# already stores the clip with the transformation applied. Any `canvas`
# widget drawn at a non-zero layout position is therefore clipped to a
# DOUBLE-translated region — at card positions like (933, 32) the group
# falls entirely outside the layer and is culled, making the mesh invisible.
# This matches iced master (render uses `clip_bounds * scale_factor` only).
# See patched/iced_tiny_skia/src/lib.rs (the `for group in &layer.primitives`
# loop). Without the patch, the status-card mesh is invisible on the
# tiny-skia fallback (headless/GPU-less machines).
iced_tiny_skia = { path = "patched/iced_tiny_skia" }


[[test]]
name = "test_serde_format"
path = "tests/test_serde_format.rs"
required-features = ["net"]

[[test]]

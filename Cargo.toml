[package]
name = "boru-core"
version = "0.231.1"
# ── EDITION ─────────────────────────────────────────────────────────
# edition = "2021" ← correct.  If you see "Rust 2015" in an error message
# from clippy-driver/rustc, you are running the linter directly on a
# source file WITHOUT the --edition flag, which defaults to 2015.
#
#   ✔ cargo clippy          (correct — Cargo passes our edition)
#   ✔ cargo clippy --fix
#   ✔ ./scripts/lint.sh     (wrapper that handles both cargo and standalone)
#   ✗ clippy-driver src/foo.rs    (defaults to Rust 2015!)
#   ✗ rustc src/foo.rs            (defaults to Rust 2015!)
#
# To run clippy on a single file outside cargo:
#   clippy-driver --edition 2021 src/foo.rs
# ──────────────────────────────────────────────────────────────────────
edition = "2021"
readme = "README.md"
description = "private, peer-to-peer communication built on Iroh"
license = "MIT/Apache-2.0"
authors = ["n0 team", "Daniel Mahony"]
repository = "https://github.com/dmahony/boru"
resolver = "2"
# examples/ is auto-discovered by default, which would re-expose
# any stray example under examples/ after the legacy [[example]] boru was
# removed (BORU-CARGO-05). The boru bin (src/bin/boru) is the single
# authoritative startup path, so auto-discovery is disabled and every genuine
# example is declared explicitly below.
autoexamples = false
# Plain `cargo run` must launch the Boru desktop app (the [[bin]] boru target).
# `sim` (src/bin/sim.rs) is a separate simulator bin and stays reachable via
# `cargo run --bin sim --features simulator`. (BORU-CARGO-03)
default-run = "boru"

# Sadly this also needs to be updated in .github/workflows/ci.yml
rust-version = "1.91"

[lib]
crate-type = ["rlib"]

[lints.rust]
missing_debug_implementations = "warn"

# We use this --cfg for documenting the cargo features on which an API
# is available.  To preview this locally use: RUSTFLAGS="--cfg
# iroh_docsrs cargo +nightly doc --all-features".  We use our own
# iroh_docsrs instead of the common docsrs to avoid also enabling this
# feature in any dependencies, because some indirect dependencies
# require a feature enabled when using `--cfg docsrs` which we can not
# do.  To enable for a crate set `#![cfg_attr(iroh_docsrs,
# feature(doc_cfg))]` in the crate.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(iroh_docsrs)"] }

[lints.clippy]
unused-async = "warn"

[dependencies]
blake3 = "1.8"
sha2 = "0.10"
aes-gcm = "0.10.3"
zeroize = "1.9"
getrandom = "0.3"
bytes = { version = "1.7", features = ["serde"] }
data-encoding = "2.6.0"
derive_more = { version = "2.0.1", features = [
    "add",
    "debug",
    "deref",
    "display",
    "from",
    "try_into",
    "into",
] }
hex = "0.4.3"
indexmap = "2.0"
iroh-metrics = { version = "1.0.1", default-features = false }
iroh-base = { version = "1", default-features = false, features = ["key"] }
n0-future = "0.3"
postcard = { version = "1", default-features = false, features = [
    "alloc",
    "use-std",
    "experimental-derive",
] }
flate2 = { version = "1", features = ["zlib"] }
rand = { version = "0.10.1", features = ["std_rng"] }
serde = { version = "1.0.164", features = ["derive"] }
rfd = { version = "0.15", optional = true }

# voice-calls dependencies (optional, native audio I/O)
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.3", optional = true }
opus = { version = "0.3", optional = true }
rubato = { version = "3", optional = true }
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }

# video-calls dependencies (optional, native camera capture + H.264 encode)
# nokhwa: input-native only (V4L2/AVFoundation/MediaFoundation). Boru renders
# with Iced, so we deliberately do NOT enable nokhwa's output-wgpu feature
# (that would drag in a second WGPU version).
nokhwa = { version = "0.10.11", features = ["input-native"], optional = true }
openh264 = { version = "0.9.7", optional = true }
# AV1 screen-share codec (BORU-SS-35): rav1e (BSD-2-Clause) encodes; rav1d
# (BSD-2-Clause, the memorysafety pure-Rust port of dav1d) decodes. Both are
# permissive and keep Boru MIT/Apache-2.0-compatible — see
# docs/screenshare-feature-review.md §3.5 for the H.265 licensing gate.
# NOTE: rav1d's `asm` feature has a broken 16bpc linkage on current releases;
# only `bitdepth_8` is enabled (pure-Rust decode path is slower but correct).
rav1e = { version = "0.8.1", default-features = false, features = ["asm", "threading"], optional = true }
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8"], optional = true }

# net dependencies (optional)
futures-concurrency = { version = "7.6.1", optional = true }

# Local TCP listener discovery for the Share Local Service dialog (desktop GUI).
netstat2 = { version = "0.11", optional = true }
sysinfo = { version = "0.38", default-features = false, features = ["system"], optional = true }

iroh = { version = "1", default-features = false, optional = true }
iroh-mdns-address-lookup = { version = "0.4", optional = true }
iroh-mainline-address-lookup = { version = "0.4", optional = true }
maxminddb = { version = "0.27", optional = true }
distributed-topic-tracker = { version = "0.3.5", default-features = false }
ed25519-dalek = "3.0.0-rc.0"
tokio = { version = "1", optional = true, features = ["io-util", "sync", "rt", "macros", "time", "fs", "net"] }

tokio-util = { version = "0.7.12", optional = true, features = ["codec", "io"] }
tracing = "0.1"
irpc = { version = "0.17.0", optional = true, default-features = false, features = [
    "derive",
    "stream",
    "spans",
] }
n0-error = { version = "1", features = ["anyhow"] }
serde-byte-array = "0.1.2"
x25519-dalek = { version = "2.0.1", features = ["getrandom", "static_secrets"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
async-trait = "0.1"
iroh-blobs = { version = "0.103", default-features = false, optional = true, features = ["fs-store"] }

# remote-control (M10) dependencies (optional, enabled by screen-sharing)
# zbus: xdg-desktop-portal RemoteDesktop D-Bus client (Linux input backend).
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
# libloading: dlopen-based PipeWire client for the Linux ScreenCast backend.
# libpipewire-0.3 is a runtime dependency only (present on any desktop with
# xdg-desktop-portal); dlopen keeps the build free of PipeWire dev headers.
libloading = { version = "0.8", optional = true }
# windows-sys: SendInput user-session input injection (Windows backend).
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"], optional = true }
# WinRT Graphics Capture for the Windows screen-sharing source. This is kept
# separate from windows-sys because the capture API is a WinRT object graph.
windows = { version = "0.58", default-features = false, features = [
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
], optional = true }
# x11rb: direct X11 capture (GetImage) fallback for the Linux ScreenCast
# backend — used when xdg-desktop-portal/PipeWire are unavailable, so real
# desktop sharing works on any X11 display. The `randr` feature enables
# monitor enumeration (RandR 1.5 GetMonitors, with a CRTC-walk fallback), the
# `xtest` feature enables XTest fake-input injection for remote control
# (PDF Task 6.2), and `damage`+`xfixes` enable damage-aware capture
# (BORU-SS-32): the XDamage extension tracks pixel changes and an XFIXES
# region carries the accumulated dirty rectangles into each frame.
x11rb = { version = "0.13", optional = true, features = ["randr", "xtest", "damage", "xfixes"] }

# filesystem notification for shared folder monitoring
notify = { version = "6", features = [] }

# directory walking for whole-folder (HashSeq collection) imports
walkdir = "2"

# test-utils dependencies (optional)
humantime-serde = { version = "1.1.1", optional = true }

# simulator dependencies (optional)
clap = { version = "4", features = ["derive"], optional = true }
toml = { version = "1.1.2", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
], optional = true }
tracing-appender = { version = "0.2.5", optional = true }
serde_json = { version = "1", optional = true }
rayon = { version = "1.10.0", optional = true }
comfy-table = { version = "7.1.4", optional = true }

iced = { version = "0.14", default-features = false, features = ["tokio", "x11", "wayland", "tiny-skia", "image", "lazy", "svg", "canvas", "advanced"], optional = true }
iced_aw = { version = "0.14.1", default-features = false, features = ["badge", "card", "color_picker"], optional = true }
iced_moving_picture = { version = "0.2", default-features = false, features = ["tokio"], optional = true }
# GStreamer-backed inline playback is available on non-Windows targets.
# Windows uses the external-player/local-stream fallback documented in
# docs/video-runtime-packaging.md, allowing --all-features cross-builds.

iced_term = { version = "0.8.0", optional = true }
regex = { version = "1", optional = true }
open = { version = "5", optional = true }
url = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mimalloc = { version = "0.1", optional = true }
profiling = { version = "1", default-features = false, features = [
    "tracy-client",
], optional = true }
rustc-hash = { version = "2", optional = true }
parking_lot = { version = "0.12" }
rusqlite = { version = "0.39", features = ["bundled"] }
anyhow = "1.0.103"
# socket2 is used only by the desktop application layer (the MCP server socket
# binding in src/bin/boru/mcp_server.rs). It is GUI-only in practice, so it is
# optional and gated behind `gui` to keep it off the core/default build path
# (BORU-REPO-003: move GUI-only dependencies to the application layer).
socket2 = { version = "0.5", optional = true }
libc = "0.2"
unicode-normalization = "0.1"
# Grapheme-cluster segmentation for emoji-safe message parsing
# (BORU-TWEMOJI-16). Already in the lock tree as a transitive dependency;
# promoted to a direct dep so the GUI crate can `use
# unicode_segmentation::UnicodeSegmentation` without a version pin mismatch.
unicode-segmentation = { version = "1", optional = true }

# p2panda encryption and core for group encryption
p2panda-encryption = { version = "0.7", features = ["message_scheme"] }
p2panda-core = "0.7"

# SPAKE2 short-code pairing (complement to QR/URI peer invitations)
spake2 = "0.4.0"
hmac = "0.12"
hkdf = "0.12"

[target.'cfg(not(target_os = "windows"))'.dependencies]
iced_video_player = { version = "0.6.0", optional = true }

[dev-dependencies]
proptest = "1.5"
tokio = { version = "1", features = [
    "io-util",
    "sync",
    "rt",
    "macros",
    "net",
    "fs",
] }
clap = { version = "4", features = ["derive"] }
humantime-serde = { version = "1.1.1" }
iroh = { version = "1", default-features = false, features = [
    "metrics",
    "test-utils",
    "tls-ring"
] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
iroh-mdns-address-lookup = "0.4"
testresult = "0.4.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
n0-tracing-test = "0.3"
tempfile = "3"
url = "2.4.0"
rand = { version = "0.10", features = ["chacha"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rusqlite = { version = "0.39", features = ["bundled"] }
criterion = "0.5"
iced_tiny_skia = "0.14"
# Same resvg 0.45 line iced's `svg` feature already activates via
# iced_tiny_skia; used only by tests/svg_render_proof.rs to rasterize a
# vendored Twemoji SVG headlessly at multiple sizes (BORU-TWEMOJI-03).
resvg = { version = "0.45", default-features = false }

[[bench]]
name = "phase23"
harness = false

[[bench]]
name = "compression_bench"
harness = false
required-features = ["net"]

[features]
# gui is in default so that plain `cargo run` (no --example/--features flags)
# builds and launches the Boru desktop app via the [[bin]] boru target.
# (BORU-CARGO-03)
default = ["net", "metrics", "gui", "wgpu-renderer"]
net = [
    "dep:irpc",
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-mdns-address-lookup",
    "dep:iroh-mainline-address-lookup",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures-concurrency",
    "dep:serde_json",
    "dep:maxminddb",
]
# Native microphone playback requires system audio libraries (cpal/ALSA) and
# libopus development headers (the `opus` crate falls back to building its
# vendored libopus from source when pkg-config cannot find the system library).
voice-calls = ["dep:cpal", "dep:rtrb", "dep:opus", "dep:rubato", "dep:nnnoiseless"]
# Video calls imply voice: enabling video-calls pulls in voice-calls.
# Camera capture needs V4L2 + libclang for bindgen (Linux), AVFoundation
# (macOS) or MediaFoundation (Windows); H.264 encoding builds the openh264
# C++ sources (needs a C++17 toolchain).
video-calls = ["voice-calls", "dep:nokhwa", "dep:openh264"]
test-utils = ["rand/chacha", "dep:humantime-serde"]
simulator = [
    "test-utils",
    "dep:tracing-subscriber",
    "dep:toml",
    "dep:clap",
    "dep:serde_json",
    "dep:rayon",
    "dep:comfy-table",
]
metrics = ["iroh-metrics/metrics"]
examples = ["net"]
gui = ["net", "dep:iced", "dep:iced_aw", "dep:iced_moving_picture", "dep:tokio", "dep:rfd", "dep:tracing-subscriber", "dep:tracing-appender", "dep:mimalloc", "dep:rayon", "dep:profiling", "dep:rustc-hash", "dep:regex", "dep:open", "dep:url", "dep:reqwest", "dep:netstat2", "dep:sysinfo", "dep:clap", "dep:toml", "dep:unicode-segmentation", "dep:socket2"]
video-playback = ["gui", "dep:iced_video_player"]
terminal = ["gui", "dep:iced_term"]
# Screen sharing is deliberately opt-in while the subsystem is integrated.
# Reuse the OpenH264 dependency already used by video-calls.
# System-audio sharing (BORU-SS-37) reuses the same cpal/opus/rtrb stack as
# voice-calls: cpal for loopback playback on the viewer, opus (RFC 6716,
# BSD-3) for the audio codec, rtrb for the bounded SPSC sample rings.
# AV1 (BORU-SS-35): rav1e (BSD-2-Clause) encode / rav1d (BSD-2-Clause) decode.
screen-sharing = ["net", "dep:openh264", "dep:zbus", "dep:libloading", "dep:windows-sys", "dep:windows", "dep:x11rb", "dep:cpal", "dep:opus", "dep:rtrb", "dep:rav1e", "dep:rav1d"]
# Developer-only live UI editor gate (BORU-UI-08). Enabling this feature
# turns the live UI editor on in ANY build (including release): boru-ui.toml
# is loaded, the file watcher runs and live theme redraw is active. It is
# deliberately NOT in `default` — ordinary users get the production theme
# path. Debug builds can also enable the editor at runtime without the
# feature via `--dev-ui` or `BORU_DEV_UI=1`; release builds cannot.
dev-ui = []
# Developer-only fast screen-sharing prototype; reuses the existing tunnel.
experimental-vnc = ["gui"]
# GPU renderer (default): iced/wgpu via Vulkan/GLES. Disable for CPU-only
# (tiny-skia) builds — e.g. Termux/ARM SoCs where wgpu cannot dlopen a GPU
# driver at runtime (fully static musl binaries can't dlopen libEGL), or
# headless/low-end boxes without GL. tiny-skia renders on the CPU instead.
wgpu-renderer = ["gui", "iced/wgpu"]



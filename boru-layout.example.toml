# boru-layout.example.toml — Boru development layout overrides (BORU-LAYOUT-10)
#
# This file documents the `boru-layout.toml` dev layout override format. Copy
# it to your data dir as `boru-layout.toml` to change Boru's STRUCTURAL
# layout WITHOUT rebuilding:
#
#   Linux/macOS:   ~/.local/share/boru/boru-layout.toml
#   Windows:       %LOCALAPPDATA%\boru\boru-layout.toml
#   (or the directory printed by `cargo run` at startup / --data-dir)
#
# The file is watched while Boru is running (BORU-LAYOUT-06): every save is
# debounced (300 ms), parsed on a background thread, validated
# (BORU-LAYOUT-07), merged onto `LayoutConfig::default()` and applied to the
# live UI — the home screen rearranges without recompiling.
#
# Rules
# -----
# * ONLY structural layout values live here — section order/visibility,
#   grid/list modes, column counts, max content widths, padding/gaps, card
#   sizing, per-component placement and responsive breakpoints. Visual
#   styling (colours, typography, radii, icon sizes) stays in `boru-ui.toml`
#   (theme_config.rs). NEVER mix theme tokens into this file.
# * Networking, chat, file transfer, video, tunnel, lobby, room and
#   persistence behaviour are NEVER configured here.
# * Every key is optional. Missing keys/groups fall back to
#   `LayoutConfig::default()` (which reproduces today's layout exactly). An
#   empty file is valid.
# * Only validated layouts are applied. A malformed file is logged with a
#   line/column error and the last known-good layout is kept — invalid TOML
#   never crashes Boru or changes the UI.
# * The file may be deleted at any time — deleting it reloads the default
#   layout and startup never fails because of it.
# * Field names mirror the layout groups in `src/bin/boru/layout.rs`
#   (home.max_content_width, home.section_order, component.video_card.*, …).
#
# Units / ranges
# --------------
# * Lengths, sizes, widths, padding, gaps, breakpoints: pixels (px),
#   positive floats; 0 is allowed for padding/gaps. Values that are
#   negative, non-finite or absurd (> 4096 px) are clamped and logged as
#   developer warnings (layout_merge.rs).
# * `home.quick_actions.columns_*` and `responsive.home_columns`:
#   integer column counts (1..=12).
# * `home.grid.main_portion` / `rail_portion`, `chat.member_list.name_portion`
#   / `role_portion`: integer FillPortion splits (1..=64).
# * `chat.bubble_width_ratio`: fraction 0..=1 of the timeline width.
# * Enum values are the Rust variant names as strings:
#     mode = "Grid" | "List"
#     home.section_order = ["Hero", "QuickActions", "MeshHealth", "PeopleActivity", "Tunnels"]
#     home.hidden_sections = ["Tunnels"]
#     sidebar.section_order = ["Chats", "Groups", "Friends", "Discover", "PublicRooms", "Requests"]
#     thumbnail_position = "Left" | "Right" | "Top" | "Bottom" | "Hidden"
#     metadata_alignment = "Start" | "Center" | "End"
#     button_placement = "Below" | "Overlay" | "Side"
#     card_orientation = "Horizontal" | "Vertical"
#     chat.composer.button_order = ["Attach", "Folder", "Gif", "Emoji", "Send"]
#
# The values below are the CURRENT BASELINE (they reproduce the default UI).
# Override only what you want to change; delete the keys you want to keep at
# their defaults.
#
# Quick live-reload demo: copy this file to your data dir as
# boru-layout.toml, run Boru with the dev UI gate on (--dev-ui /
# BORU_DEV_UI=1), then edit a value and save — the home screen re-lays out
# within ~300 ms.

# ── Home dashboard (layout.rs::HomeLayout) ────────────────────────────
[home]
# Vertical section order (top→bottom; left column first, then the right
# rail in grid mode).
section_order = ["Hero", "QuickActions", "MeshHealth", "PeopleActivity", "Tunnels"]
# Sections hidden entirely from the dashboard. Empty = all visible.
hidden_sections = []
# Grid (two-column dashboard) vs List (single stacked column).
mode = "Grid"
# Max dashboard canvas width (DASHBOARD_MAX_WIDTH = 1480 px).
max_content_width = 1480.0

# Main/rail grid split and the stacking rule.
[home.grid]
main_portion = 2
rail_portion = 1
column_gap = 24.0
stack_breakpoint = 720.0

# Quick-action card grid: column counts per width tier + the two
# content-width breakpoints that switch between them.
[home.quick_actions]
columns_wide = 4
columns_mid = 2
columns_narrow = 1
four_col_breakpoint = 1000.0
two_col_breakpoint = 520.0

# Dashboard canvas padding. (The live canvas's horizontal padding actually
# comes from responsive.home_padding_x; these slots remain the historical
# two-tier model whose values the responsive defaults reference.)
[home.padding]
top = 28.0
bottom = 32.0
horizontal_large = 32.0
horizontal_default = 28.0

# Vertical/horizontal gaps between sections and cards.
[home.gaps]
card_gap = 20.0
hero_gap = 40.0
header_dashboard_gap = 40.0
footer_gap = 16.0
compact_header_stack_gap = 12.0

# Card sizing constraints (min heights, row heights, icon containers).
[home.card_sizing]
peers_body_min = 128.0
activity_row_height = 32.0
quick_action_icon_size = 40.0
status_card_min_content_height = 110.0
status_card_medium_content = 760.0
status_card_narrow_content = 560.0
status_card_mesh_hide_content = 520.0
status_card_text_min_width = 260.0
status_card_text_min_width_medium = 260.0
status_card_mesh_max_width = 510.0
status_card_padding_x = 24.0
status_icon_text_gap_full = 24.0
status_icon_text_gap_medium = 20.0
status_text_graph_gap_full = 24.0
status_text_graph_gap_medium = 24.0
status_divider_width = 44.0
status_divider_height = 3.0

# ── Sidebar shell (layout.rs::SidebarLayout) ──────────────────────────
[sidebar]
width = 304.0
width_min = 288.0
width_max = 320.0
inset = 24.0
section_order = ["Chats", "Groups", "Friends", "Discover", "PublicRooms", "Requests"]
hidden_sections = []

# Padding regions inside the sidebar.
[sidebar.padding]
brand_top = 16.0
brand_bottom = 8.0
identity_top = 4.0
identity_bottom = 8.0
section_top = 4.0
utility_top = 8.0
utility_bottom = 12.0
row_x = 12.0
join_top = 8.0
join_bottom = 4.0

# Row heights for sidebar lists.
[sidebar.row_heights]
conversation_row = 48.0
peer_row = 60.0
peer_panel_max_height = 320.0
default_list_max_height = 180.0

# ── Chat screen (layout.rs::ChatLayout) ───────────────────────────────
[chat]
bubble_max_width = 560.0
bubble_width_ratio = 0.68
message_max_width = 480.0
image_preview_max_width = 360.0
image_preview_max_height = 400.0
context_menu_width = 180.0
details_panel_width = 280.0

[chat.emoji_picker]
width = 336.0
scroll_height = 200.0

[chat.gif_picker]
width = 320.0
scroll_height = 300.0
thumbnail_width = 150.0
thumbnail_height = 100.0

[chat.screen_share]
width = 640.0
height = 360.0

# Composer bar: button order (the text input is always between the leading
# and trailing buttons) and row spacing/padding.
[chat.composer]
button_order = ["Attach", "Folder", "Gif", "Emoji", "Send"]
spacing = 6.0
padding = 4.0

[chat.member_list]
width = 300.0
max_height = 500.0
name_portion = 3
role_portion = 1

# ── Component placement (layout.rs::ComponentLayout, PDF Task 5) ───────
# Per-component placement: thumbnail position, metadata alignment, button
# placement and card orientation. Each wired component keeps its own struct
# so one component can be rearranged without touching the others.
# The leaves here are the GLOBAL fallback for components without a
# dedicated struct; the per-component tables below override them.
[component]
thumbnail_position = "Left"
metadata_alignment = "Start"
button_placement = "Below"
card_orientation = "Horizontal"

# Video / file attachment card.
[component.video_card]
thumbnail_position = "Top"
metadata_alignment = "Start"
button_placement = "Below"
card_orientation = "Vertical"

# "Files I'm Sharing" rows.
[component.shared_by_me]
thumbnail_position = "Left"
metadata_alignment = "Start"
button_placement = "Side"
card_orientation = "Horizontal"

# Video attachment card sizing.
[component.video]
narrow_breakpoint = 560.0
medium_breakpoint = 780.0
play_overlay_size = 64.0
header_filename_max_width = 420.0
controls_slider_width = 90.0

# ── Data tables (layout.rs::TablesLayout) ─────────────────────────────
[tables.file_table]
size_col = 72.0
source_col = 120.0
ago_col = 120.0
peer_col = 140.0
started_col = 120.0
state_col = 110.0
direction_col = 90.0
event_col = 110.0
details_col = 80.0
download_started_col = 100.0
download_state_col = 100.0
activity_ago_col = 110.0

[tables.shared_table]
shared_with = 144.0
size = 64.0
shared_on = 122.0
downloads = 80.0
actions = 36.0

# ── Responsive (layout.rs::ResponsiveLayout, PDF Task 4) ───────────────
# Viewport tiers: Narrow (< narrow_max_width), Desktop (between),
# UltraWide (>= ultra_wide_min_width). All widths in px.
[responsive]
viewport_ref_width = 1280.0
viewport_ref_height = 800.0
viewport_min_width = 1024.0
viewport_min_height = 720.0
viewport_lg_width = 1440.0
viewport_lg_height = 900.0
viewport_xl_width = 1920.0
viewport_xl_height = 1080.0
content_max_width = 720.0
home_illustration_full_content = 720.0
home_illustration_hide_content = 520.0
home_compact_header_content = 560.0
narrow_max_width = 360.0
ultra_wide_min_width = 1440.0

# Per-tier home dashboard column counts: narrow 1 (stacked), desktop 2
# (main + rail), ultra-wide 2 (main + rail on a wider canvas).
[responsive.home_columns]
narrow = 1
desktop = 2
ultra_wide = 2

# Per-tier home dashboard horizontal canvas padding.
[responsive.home_padding_x]
narrow = 28.0
desktop = 28.0
ultra_wide = 32.0

# Height-aware dialog and short-window layout values (RESP-09). The
# per-tier caps apply to the scrollable dialog body; the footer remains
# reachable. These are structural values, not theme settings.
# Per-tier maximum scrollable dialog body height.
dialog_body_max_height = { narrow = 360.0, desktop = 480.0, ultra_wide = 520.0 }
# Short-window chrome reserve, minimum body height and whitespace scale.
short_window_body_reserve = 220.0
short_window_body_min_height = 180.0
short_window_spacing_scale = 0.7

# ── Future screens (extension point) ──────────────────────────────────
# Per-screen layout for future screens, keyed by a stable screen id.
# # [screens.settings]
# # section_order = []
# # hidden_sections = []
# # max_content_width = 720.0
# # columns = 1
